name: QuickBite — Build & Deploy to ECS

on:
  push:
    branches:
      - main       # triggers production deployment
    paths-ignore:
      - 'docs/**'
      - 'postman/**'
      - 'scripts/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main       # only runs CI checks (build + test), no deploy
    paths-ignore:
      - 'docs/**'
      - 'postman/**'
      - 'scripts/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw clean verify -B
        env:
          # Provide minimal env so Spring context doesn't fail during test
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: target/surefire-reports/

  # ── Job 2: Push image to ECR (main branch only) ──────────────────────────
  push-image:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write   # Required for GitHub OIDC token exchange with AWS STS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    outputs:
      image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image to ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to ECS ─────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    needs: push-image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: ecs-deploy-prod
      cancel-in-progress: false
    permissions:
      id-token: write   # Required for GitHub OIDC token exchange with AWS STS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out new image to ECS Express Mode service
        env:
          IMAGE: ${{ needs.push-image.outputs.image }}
          ECS_EXPRESS_SERVICE_ARN: ${{ vars.ECS_EXPRESS_SERVICE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ECS_EXPRESS_SERVICE_ARN" ]; then
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECS_EXPRESS_SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/${ECS_CLUSTER}/${ECS_SERVICE}"
          fi

          PRIMARY_CONTAINER=$(aws ecs describe-express-gateway-service \
            --service-arn "$ECS_EXPRESS_SERVICE_ARN" \
            --query 'service.activeConfigurations[0].primaryContainer' \
            --output json | jq -c --arg img "$IMAGE" '.image = $img')

          if [ -z "$PRIMARY_CONTAINER" ] || [ "$PRIMARY_CONTAINER" = "null" ]; then
            echo "::error::Could not read primaryContainer from $ECS_EXPRESS_SERVICE_ARN"
            exit 1
          fi

          aws ecs update-express-gateway-service \
            --service-arn "$ECS_EXPRESS_SERVICE_ARN" \
            --primary-container "$PRIMARY_CONTAINER"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
