            type: string
            format: uuid
      responses:
        '204':
          description: Item removed

  /api/v1/customer/cart/checkout-preview:
    get:
      tags: [Shopping Cart]
      summary: Get Checkout Preview
      description: Computes live road-distance (OSRM / Mapbox / Haversine fallback) delivery fee, platform fee, GST, tip, and `totalAmount` (`expectedTotal` for order placement).
      parameters:
        - in: query
          name: addressId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: tipAmount
          schema:
            type: number
            format: double
            minimum: 0
            default: 0
      responses:
        '200':
          description: Checkout price breakdown and ETA preview

  # ─── ORDERS (CUSTOMER) ───────────────────────────────────────────────────────

  /api/v1/customer/orders:
    get:
      tags: [Orders (Customer)]
      summary: List My Orders
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated order list
    post:
      tags: [Orders (Customer)]
      summary: Place Order from Cart
      description: Converts the active cart into an Order (`PLACED` immediately for `COD`, or `AWAITING_PAYMENT` with a 10-minute payment window for online methods). Returns polymorphic `PaymentResult` (`COD`, `STUB_ONLINE`, or `ONLINE`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order created and payment initiated
        '409':
          description: Price changed since checkout preview (`expectedTotal` mismatch)

  /api/v1/customer/orders/{orderId}:
    get:
      tags: [Orders (Customer)]
      summary: Get Order Details & Tracking
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details with status history and actor audit trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /api/v1/customer/orders/{orderId}/cancel:
    delete:
      tags: [Orders (Customer)]
      summary: Cancel Order
      description: Cancels an order in `AWAITING_PAYMENT`, `PAYMENT_FAILED`, or `PLACED` status (automatically initiating a gateway refund if already paid). Blocked once `ACCEPTED`.
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Order cancelled

  /api/v1/customer/orders/{orderId}/retry-payment:
    post:
      tags: [Orders (Customer)]
      summary: Retry Failed Order Payment
      description: Retries payment for an order in `AWAITING_PAYMENT` or `PAYMENT_FAILED` within the 10-minute payment window, optionally switching `paymentMethod` (including to `COD`).
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: paymentMethod
          required: false
          schema:
            $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: New payment attempt initiated

  /api/v1/customer/orders/{orderId}/delivery-agent:
    get:
      tags: [Orders (Customer)]
      summary: Get Order Delivery Agent Details
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assigned delivery agent info, vehicle details, and live coordinates

