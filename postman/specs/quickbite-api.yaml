openapi: 3.1.0
info:
  title: QuickBite API
  version: 1.0.0
  description: |-
    REST API for the **QuickBite** multi-tenant food delivery platform (Spring Boot 4.1.0, Java 25).

    ## Authentication & Dual-JWT Architecture
    Protected endpoints require an RSA-signed (`RS256`) Bearer JWT obtained via `POST /api/v1/auth/login`.
    Every authentication/session-issuing call (`login`, `refresh-token`, `claim-session`) **requires** the `X-Client-Type` header (`web_browser` or `mobile_app`).

    - **Access Token** (`aud: quickbite-api`, TTL `15m`) — carries `SCOPE_API` + `ROLE_*`. Sent as `Authorization: Bearer <accessToken>`.
    - **Challenge Token** (`aud: quickbite-auth`, TTL `5m`) — carries `SCOPE_AUTH` only. Returned inside `409 Conflict` (`SessionLimitErrorResponse`) when concurrent active device limits (`max-sessions-per-user = 2`) are exceeded; used exclusively on `/api/v1/auth/sessions` and `/api/v1/auth/claim-session`.
    - **Refresh Token** (opaque, SHA-256 hashed in PostgreSQL with family-based rotation & reuse breach detection, TTL `7d`):
      - `X-Client-Type: web_browser` → transported via `HttpOnly; Secure; SameSite=Strict` cookie (`refreshToken`, `Path=/api/v1/auth`); `refreshToken` in JSON body is `null`.
      - `X-Client-Type: mobile_app` → returned in `AuthResponse.refreshToken` JSON body and sent back in `RefreshRequest` JSON body.

    ## Roles
    | Role | Description |
    |------|-------------|
    | `ROLE_CUSTOMER` | End customer browsing catalog, managing cart, placing orders, paying, and reviewing |
    | `ROLE_RESTAURANT_OWNER` | Merchant onboarding restaurants, managing menus/schedules, and fulfilling kitchen orders |
    | `ROLE_DELIVERY_AGENT` | Courier completing KYC/vehicle onboarding, streaming live GPS, and fulfilling dispatches |
    | `ROLE_ADMIN` | Internal platform administrator moderating onboarding, cuisines, reviews, agents, vehicles, and refunds |

  contact:
    name: QuickBite Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local Development

tags:
  - name: Auth
    description: Registration, login, silent refresh token rotation, and logout
  - name: Sessions
    description: Concurrent device session challenge inspection, revocation, and claiming (SCOPE_AUTH)
  - name: Customer Profile
    description: Customer profile and saved GPS delivery addresses
  - name: Shopping Cart
    description: Redis-backed single-restaurant cart management and live checkout preview
  - name: Orders (Customer)
    description: Order placement, live tracking, payment retry, and customer cancellation
  - name: Payments (Customer)
    description: Order payment inspection and client-side gateway signature verification
  - name: Reviews (Customer)
    description: Post-delivery 1–5 star customer review submission and management
  - name: Restaurant Owner — Onboarding
    description: Step-by-step restaurant onboarding application lifecycle
  - name: Restaurant Owner — Operations
    description: Approved restaurant profile, operating hours, gallery, and open/closed toggle
  - name: Restaurant Owner — Menu
    description: Dish catalog CRUD and menu item image management
  - name: Restaurant Owner — Orders
    description: Kitchen order fulfillment, courier tracking, and restaurant earnings summary
  - name: Restaurant Owner — Cuisines
    description: Proposals for new platform cuisine categories
  - name: Delivery Agent — Onboarding
    description: Delivery partner KYC application and embedded vehicle onboarding
  - name: Delivery Agent — Vehicles
    description: Standalone vehicle onboarding applications and approved fleet management
  - name: Delivery Agent — Shift
    description: Courier profile, shift availability toggle, and Redis Geo live GPS streaming
  - name: Delivery Agent — Dispatch
    description: Active dispatch offers, offer acceptance/rejection, package pickup, and delivery completion
  - name: Admin — Users
    description: Internal administrator account provisioning and listing
  - name: Admin — Restaurant Applications
    description: Restaurant onboarding application review, approval, and rejection
  - name: Admin — Agent Applications
    description: Delivery agent KYC application review, approval, and rejection
  - name: Admin — Vehicle Applications
    description: Vehicle onboarding application review and active vehicle ownership governance
  - name: Admin — Agent Compliance
    description: Delivery agent directory, suspension, and reinstatement
  - name: Admin — Cuisine Moderation
    description: Moderation of merchant-proposed cuisine categories
  - name: Admin — Review Moderation
    description: Platform-wide customer review inspection and policy takedowns
  - name: Admin — Orders & Payments
    description: Administrative post-delivery order refunds and payment audit logs
  - name: Admin — Allotments
    description: Onboarding review task allotment queue (accept / decline)
  - name: Notifications
    description: Polymorphic in-app notifications across orders, payments, onboarding, and cuisines
  - name: File Uploads
    description: Presigned AWS S3 PUT URL generation for direct client uploads
  - name: Webhooks
    description: Server-to-server Razorpay and local dev stub payment webhook receivers
  - name: Public Catalog
    description: Unauthenticated cuisine directory, PostGIS restaurant search, menus, and public reviews
  - name: Actuator
    description: Spring Boot health and build info probes

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Pass `accessToken` (`aud: quickbite-api`, `SCOPE_API`) for standard protected APIs,
        or `challengeToken` (`aud: quickbite-auth`, `SCOPE_AUTH`) for `/api/v1/auth/sessions` and `/api/v1/auth/claim-session`.

  parameters:
    ClientTypeHeader:
      in: header
      name: X-Client-Type
      required: true
      description: Client platform identifier controlling refresh token delivery (`HttpOnly` cookie vs JSON body).
      schema:
        type: string
        enum: [web_browser, mobile_app]

    CursorParam:
      in: query
      name: cursor
      required: false
      description: UUIDv7 cursor (`nextCursor` from previous page) for keyset pagination.
      schema:
        type: string
        format: uuid

    PageSizeParam:
      in: query
      name: size
      required: false
      description: Maximum number of records per page.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    OrderStatus:
      type: string
      enum:
        - AWAITING_PAYMENT
        - PAYMENT_FAILED
        - PLACED
        - ACCEPTED
        - PREPARING
        - READY_FOR_PICKUP
        - OUT_FOR_DELIVERY
        - DELIVERED
        - CANCELLED
        - DECLINED
        - ABANDONED

    OrderCancellationReason:
      type: string
      enum:
        - CUSTOMER_REQUESTED
        - RESTAURANT_UNRESPONSIVE
        - NO_AGENT_FOUND

    PaymentMethod:
      type: string
      enum: [UPI, CARD, NET_BANKING, WALLET, COD]

    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED, CANCELLED, REFUNDED, REFUND_FAILED]

    ApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]

    RegisterRequest:
      type: object
      required: [name, email, phoneNumber, password]
      properties:
        name:
          type: string
          example: Aarav Sharma
        email:
          type: string
          format: email
          example: aarav.sharma@quickbite.com
        phoneNumber:
          type: string
          minLength: 10
          maxLength: 20
          example: "+919876543210"
        password:
          type: string
          format: password
          example: Pass@123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      description: Required when `X-Client-Type` is `mobile_app`. Ignored for `web_browser` (cookie is used).
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: [string, "null"]
          description: Populated for `mobile_app`; `null` for `web_browser` (delivered via `HttpOnly` cookie).
        expiresIn:
          type: integer
          format: int64
          example: 900
        sessionId:
          type: string
          format: uuid
        tokenType:
          type: string
          example: Bearer

    SessionLimitErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Maximum active sessions reached. Please revoke an existing session to continue.
        challengeToken:
          type: string
          description: "5-minute RSA JWT (`aud: quickbite-auth`, `SCOPE_AUTH`) used to inspect/revoke sessions and claim a new session."
        maxSessions:
          type: integer
          example: 2

    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        deviceName:
          type: string
        deviceOS:
          type: string
        clientType:
          type: string
          enum: [WEB_BROWSER, MOBILE_APP]
        ipAddress:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        loginAt:
          type: string
          format: date-time
        daysLeft:
          type: integer

    CursorPage:
      type: object
      properties:
        content:
          type: array
          items: {}
        nextCursor:
          type: [string, "null"]
          format: uuid
        hasNext:
          type: boolean
        size:
          type: integer

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

    AddressRequest:
      type: object
      required: [label, street, city, state, country, latitude, longitude]
      properties:
        label:
          type: string
          maxLength: 50
          example: Home
        houseNumber:
          type: string
          maxLength: 20
        buildingName:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 150
        landmark:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 50
        state:
          type: string
          maxLength: 50
        country:
          type: string
          maxLength: 50
        postalCode:
          type: string
          maxLength: 10
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean

    RestaurantApplicationAddressRequest:
      type: object
      required: [street, city, state, country, latitude, longitude]
      properties:
        street:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 50
        state:
          type: string
          maxLength: 50
        country:
          type: string
          maxLength: 50
        postalCode:
          type: string
          maxLength: 10
        houseNumber:
          type: string
          maxLength: 20
        buildingName:
          type: string
          maxLength: 100
        landmark:
          type: string
          maxLength: 100
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    CartItemRequest:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    PlaceOrderRequest:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId:
          type: string
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        tipAmount:
          type: number
          format: double
          minimum: 0
          default: 0
        expectedTotal:
          type: number
          format: double
          minimum: 0
          description: Optional price-drift guard matching `priceBreakdown.totalAmount` from `/checkout-preview`. Triggers `409 Conflict` if menu/fee totals changed.

    OrderStatusHistoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        timestamp:
          type: string
          format: date-time
        changedById:
          type: [string, "null"]
          format: uuid
        changedByName:
          type: [string, "null"]

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        restaurantName:
          type: string
        deliveryAddress:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              menuItemId:
                type: string
                format: uuid
              menuItemName:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
              totalPrice:
                type: number
        subtotal:
          type: number
        discountAmount:
          type: number
        deliveryFee:
          type: number
        platformFee:
          type: number
        taxAmount:
          type: number
        tipAmount:
          type: number
        totalAmount:
          type: number
        currentStatus:
          $ref: '#/components/schemas/OrderStatus'
        cancellationReason:
          oneOf:
            - $ref: '#/components/schemas/OrderCancellationReason'
            - type: "null"
        restaurantAcceptanceDeadline:
          type: [string, "null"]
          format: date-time
        deliveryAgent:
          type: [object, "null"]
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusHistoryDto'
        deliveryDistanceMeters:
          type: [number, "null"]
          format: double
        estimatedDeliverySeconds:
          type: [integer, "null"]
          format: int64
        createdAt:
          type: string
          format: date-time

    RestaurantEarningsResponse:
      type: object
      properties:
        restaurantId:
          type: string
          format: uuid
        deliveredOrdersCount:
          type: integer
          format: int64
        totalGrossSales:
          type: number
        totalFoodSubtotal:
          type: number
        totalPlatformFees:
          type: number
        totalTaxesCollected:
          type: number
        computedAt:
          type: string
          format: date-time

    OrderOfferSummaryResponse:
      type: object
      properties:
        offerId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        roundNumber:
          type: integer
        radiusKm:
          type: number
        orderStatus:
          type: string
        orderSubtotal:
          type: number
        orderTotalAmount:
          type: number
        customerName:
          type: string
        customerPhone:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
              subTotal:
                type: number
        restaurantName:
          type: string
        restaurantAddress:
          type: string
        deliveryAddress:
          type: string
        deliveryDistanceKm:
          type: [number, "null"]
          format: double
        estimatedDeliverySeconds:
          type: [integer, "null"]
          format: int64
        guaranteedPayout:
          type: number
        tipAmount:
          type: number
        estimatedTotalPayout:
          type: number
        offeredAt:
          type: string
          format: date-time
        offerExpiresAt:
          type: string
          format: date-time
        secondsRemaining:
          type: integer
          format: int64

    ReviewRequest:
      type: object
      required: [orderId, rating]
      properties:
        orderId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    MenuItemRequest:
      type: object
      required: [name, description, cuisineId, price, category]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        cuisineId:
          type: string
          format: uuid
        price:
          type: number
          format: double
          minimum: 0.01
        category:
          type: string
          maxLength: 50
        isAvailable:
          type: boolean

    RejectRequest:
      type: object
      required: [remarks]
      properties:
        remarks:
          type: string
          maxLength: 500

    ExpireVehicleOwnershipRequest:
      type: object
      required: [remarks]
      properties:
        remarks:
          type: string
          maxLength: 500

    SuspendAgentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500

    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500

    UpdateLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    AvailabilityRequest:
      type: object
      required: [available]
      properties:
        available:
          type: boolean

    VehicleDetailsRequest:
      type: object
      required: [vinNumber, numberPlate, vehicleType, brand, model]
      properties:
        vinNumber:
          type: string
          minLength: 6
          maxLength: 30
        numberPlate:
          type: string
          minLength: 3
          maxLength: 20
        vehicleType:
          type: string
          enum: [BIKE, SCOOTER, BICYCLE, CAR]
        brand:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        isOwnershipTransferred:
          type: boolean

    DocumentAttachRequest:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
          description: Document enum value (`FSSAI_LICENSE`, `GST`, `PAN`, `BANK_PROOF`, `BUSINESS_LICENSE` for restaurants; `AADHAR`, `DRIVING_LICENSE`, `OTHER` for agents; `RC`, `INSURANCE`, `TRANSFER_NOC`, `OTHER` for vehicles).
        url:
          type: string
          format: uri

    FileUploadUrlRequest:
      type: object
      required: [context, applicationId, contentType, fileName]
      properties:
        context:
          type: string
          enum: [RESTAURANT_IMAGE, RESTAURANT_DOCUMENT]
        applicationId:
          type: string
          format: uuid
        contentType:
          type: string
          example: image/jpeg
        fileName:
          type: string
          example: storefront.jpg

    FileUploadUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
        fileUrl:
          type: string
          format: uri

    PaymentVerifyRequest:
      type: object
      required: [gatewayOrderId, gatewayPaymentId, gatewaySignature]
      properties:
        gatewayOrderId:
          type: string
        gatewayPaymentId:
          type: string
        gatewaySignature:
          type: string

security:
  - bearerAuth: []

paths:

  # ─── AUTH ────────────────────────────────────────────────────────────────────

  /api/v1/auth/register/customer:
    post:
      tags: [Auth]
      summary: Register Customer
      description: Creates a new `ROLE_CUSTOMER` account with Argon2 password hashing. Does not start a session; call `POST /api/v1/auth/login` next.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer registered successfully
        '409':
          description: Email or phone number already in use

  /api/v1/auth/register/restaurant-owner:
    post:
      tags: [Auth]
      summary: Register Restaurant Owner
      description: Creates a new `ROLE_RESTAURANT_OWNER` account. Does not start a session; call `POST /api/v1/auth/login` next.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Restaurant owner registered successfully
        '409':
          description: Email or phone number already in use

  /api/v1/auth/register/delivery-agent:
    post:
      tags: [Auth]
      summary: Register Delivery Agent
      description: Creates a new `ROLE_DELIVERY_AGENT` account. Does not start a session; call `POST /api/v1/auth/login` next.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Delivery agent registered successfully
        '409':
          description: Email or phone number already in use

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with Email & Password
      description: Verifies Argon2 credentials and issues an RSA access token (`15m`) plus a refresh token (`HttpOnly` cookie for `web_browser`, JSON body for `mobile_app`). Returns `409 Conflict` with a 5-minute `challengeToken` if concurrent session limits are exceeded.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing or invalid `X-Client-Type` header
        '401':
          description: Invalid credentials
        '409':
          description: Maximum active sessions reached — `SCOPE_AUTH` challenge token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLimitErrorResponse'

  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh Access Token
      description: Rotates the refresh token within its token family (detecting token reuse breaches) and issues a fresh access token. Reads the `refreshToken` `HttpOnly` cookie for `web_browser`, or the JSON request body for `mobile_app`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientTypeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token and rotated refresh token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token missing, expired, or revoked (reuse breach detected)

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout Current Device
      description: Revokes the current device session (`sid` claim) in PostgreSQL and Redis and clears the `refreshToken` cookie.
      responses:
        '204':
          description: Logged out successfully

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout All Devices
      description: Revokes all active sessions across all devices for the authenticated user and clears the `refreshToken` cookie.
      responses:
        '204':
          description: All sessions revoked

  # ─── SESSIONS (SCOPE_AUTH) ───────────────────────────────────────────────────

  /api/v1/auth/sessions:
    get:
      tags: [Sessions]
      summary: List Active Device Sessions
      description: "Requires `Authorization: Bearer <challengeToken>` (`SCOPE_AUTH`). Lists active sessions so the user can pick one to revoke."
      responses:
        '200':
          description: List of active device sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: Revoke Device Session
      description: "Requires `Authorization: Bearer <challengeToken>` (`SCOPE_AUTH`). Revokes an existing device session to free a slot."
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session revoked

  /api/v1/auth/claim-session:
    post:
      tags: [Sessions]
      summary: Claim Challenged Session
      description: "Requires `Authorization: Bearer <challengeToken>` (`SCOPE_AUTH`) and `X-Client-Type`. Creates the new session after freeing a slot and issues `SCOPE_API` tokens."
      parameters:
        - $ref: '#/components/parameters/ClientTypeHeader'
      responses:
        '200':
          description: Session claimed, access and refresh tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Concurrent session limit still full

  # ─── CUSTOMER PROFILE ────────────────────────────────────────────────────────

  /api/v1/customer/me:
    get:
      tags: [Customer Profile]
      summary: Get Customer Profile
      responses:
        '200':
          description: Customer profile
    put:
      tags: [Customer Profile]
      summary: Update Customer Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phoneNumber, email]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                phoneNumber:
                  type: string
                  minLength: 10
                  maxLength: 15
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated

  /api/v1/customer/me/addresses:
    get:
      tags: [Customer Profile]
      summary: List Saved Delivery Addresses
      responses:
        '200':
          description: List of saved addresses
    post:
      tags: [Customer Profile]
      summary: Add Delivery Address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
