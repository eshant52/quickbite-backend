    get:
      tags: [Admin — Review Moderation]
      summary: List Customer Reviews (Moderation)
      parameters:
        - in: query
          name: restaurantId
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of customer reviews

  /api/v1/admin/reviews/{id}:
    get:
      tags: [Admin — Review Moderation]
      summary: Inspect Single Review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review details
    delete:
      tags: [Admin — Review Moderation]
      summary: Remove Inappropriate Review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Review removed

  # ─── ADMIN — ORDERS & PAYMENTS ───────────────────────────────────────────────

  /api/v1/admin/payments/order/{orderId}:
    get:
      tags: [Admin — Orders & Payments]
      summary: Inspect Payment Details by Order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details and status audit log

  /api/v1/admin/orders/{orderId}/refund:
    post:
      tags: [Admin — Orders & Payments]
      summary: Refund Delivered Order
      description: Issues an administrative post-delivery refund on a `DELIVERED` order (`PaymentStatus` transitions to `REFUNDED` while `OrderStatus` remains `DELIVERED`).
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund initiated

  # ─── ADMIN — ALLOTMENTS ──────────────────────────────────────────────────────

  /api/v1/admin/allotments/pending:
    get:
      tags: [Admin — Allotments]
      summary: List My Pending Onboarding Allotments
      responses:
        '200':
          description: List of pending onboarding review allotments (`RESTAURANT_APPLICATION`, `DELIVERY_AGENT_APPLICATION`, `VEHICLE_APPLICATION`, `CUISINE`)

  /api/v1/admin/allotments/{allotmentId}/accept:
    post:
      tags: [Admin — Allotments]
      summary: Accept Onboarding Allotment
      parameters:
        - in: path
          name: allotmentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allotment accepted

  /api/v1/admin/allotments/{allotmentId}/decline:
    post:
      tags: [Admin — Allotments]
      summary: Decline Onboarding Allotment
      parameters:
        - in: path
          name: allotmentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allotment declined and reassigned

  # ─── NOTIFICATIONS ────────────────────────────────────────────────────────────

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List My Notifications
      description: Returns joined-inheritance in-app notifications (`OrderNotification`, `PaymentNotification`, `RestaurantApplicationNotification`, `DeliveryAgentApplicationNotification`, `VehicleApplicationNotification`, `CuisineNotification`).
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated notifications

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get Unread Notification Count
      responses:
        '200':
          description: Unread notification count

  /api/v1/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark Notification as Read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read

  /api/v1/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark All Notifications as Read
      responses:
        '204':
          description: All notifications marked as read

  # ─── FILE UPLOADS ─────────────────────────────────────────────────────────────

  /api/v1/files/upload-url:
    post:
      tags: [File Uploads]
      summary: Generate Presigned S3 Upload URL
      description: Generates a short-lived presigned AWS S3 `PUT` URL (`uploadUrl`) and canonical object URL (`fileUrl`) for direct client uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadUrlRequest'
      responses:
        '200':
          description: Presigned URL and canonical file URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadUrlResponse'

  # ─── WEBHOOKS ─────────────────────────────────────────────────────────────────

  /api/v1/webhooks/payments/razorpay:
    post:
      tags: [Webhooks]
      summary: Razorpay Payment Webhook Receiver
      description: Server-to-server webhook endpoint verified via HMAC-SHA256 `X-Razorpay-Signature` over the raw JSON body (`payment.captured`, `payment.failed`, `refund.processed`, `refund.failed`).
      security: []
      parameters:
        - in: header
          name: X-Razorpay-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

  /api/v1/webhooks/payments/stub:
    post:
      tags: [Webhooks]
      summary: Local Stub Payment Webhook
      description: Development-only (`dev` profile) stub for simulating payment gateway callbacks without external credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, status]
              properties:
                transactionId:
                  type: string
                status:
                  $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Stub webhook processed

  # ─── PUBLIC CATALOG ───────────────────────────────────────────────────────────

  /api/v1/cuisines:
    get:
      tags: [Public Catalog]
      summary: List Approved Cuisines
      security: []
      responses:
        '200':
          description: List of admin-approved cuisine categories

  /api/v1/restaurants:
    get:
      tags: [Public Catalog]
      summary: List Approved Restaurants
      security: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: cuisineId
          schema:
            type: string
            format: uuid
        - in: query
          name: minRating
          schema:
            type: number
            format: double
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated approved restaurant list

  /api/v1/restaurants/nearby:
    get:
      tags: [Public Catalog]
      summary: Search Nearby Restaurants (Geo-Spatial)
      description: PostGIS `ST_DWithin` spatial radius search (`100`–`50000` metres) with optional name, cuisine, and minimum rating filters, sorted by distance.
      security: []
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - in: query
          name: lng
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - in: query
          name: radius
          description: Search radius in metres (`100`–`50000`).
          schema:
            type: integer
            default: 5000
            minimum: 100
            maximum: 50000
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: cuisineId
          schema:
            type: string
            format: uuid
        - in: query
          name: minRating
          schema:
            type: number
            format: double
        - in: query
          name: page
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Nearby restaurants sorted by distance

  /api/v1/restaurants/{id}:
    get:
      tags: [Public Catalog]
      summary: Get Public Restaurant Details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public restaurant details

  /api/v1/restaurants/{restaurantId}/menu-items:
    get:
      tags: [Public Catalog]
      summary: List Restaurant Menu Items
      security: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: available
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Paginated menu items

  /api/v1/restaurants/{restaurantId}/menu-items/{itemId}:
    get:
      tags: [Public Catalog]
      summary: Get Menu Item Details
      security: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Menu item details

  /api/v1/restaurants/{restaurantId}/reviews:
    get:
      tags: [Public Catalog]
      summary: List Restaurant Customer Reviews
      security: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated public reviews

  /api/v1/restaurants/{restaurantId}/reviews/summary:
    get:
      tags: [Public Catalog]
      summary: Get Restaurant Rating Summary
      security: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rating summary (average, total count, 1–5 star distribution)

  # ─── ACTUATOR ─────────────────────────────────────────────────────────────────

  /actuator/health:
    get:
      tags: [Actuator]
      summary: Check Application Health
      security: []
      responses:
        '200':
          description: Application is healthy
        '503':
          description: Application is unhealthy

  /actuator/info:
    get:
      tags: [Actuator]
      summary: Get Application Build Info
      security: []
      responses:
        '200':
          description: Build and version info
