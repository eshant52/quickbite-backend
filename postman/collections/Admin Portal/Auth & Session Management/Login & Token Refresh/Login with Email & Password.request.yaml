$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  X-Client-Type: web_browser
body:
  type: json
  content: |-
    {
        "email": "eshantsonune52@gmail.com",
        "password": "Pass@123"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json(); 
      pm.collectionVariables.set("challenge_token", response.challengeToken); 
      pm.collectionVariables.set("access_token", response.accessToken); 
      pm.collectionVariables.set("refresh_token", response.refreshToken); 
      pm.collectionVariables.set("session_id", response.sessionId);
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("access_token", "")
    language: text/javascript
examples: ./.resources/Login with Email & Password.resources/examples
order: 1000
