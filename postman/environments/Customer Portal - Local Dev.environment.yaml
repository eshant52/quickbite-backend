name: Customer Portal - Local Dev
values:
  - key: base_url
    value: 'http://localhost:8080'
    enabled: true
    type: default
    description: QuickBite API base URL
  - key: access_token
    value: ''
    enabled: true
    type: secret
    description: JWT access token for Customer role (auto-set by Login script)
  - key: refresh_token
    value: ''
    enabled: true
    type: secret
    description: Opaque refresh token (HttpOnly cookie, also captured here for reference)
  - key: challenge_token
    value: ''
    enabled: true
    type: secret
    description: Short-lived challenge token returned on login when MFA/device challenge is triggered
  - key: session_id
    value: ''
    enabled: true
    type: default
    description: Active session UUID
  - key: customer_email
    value: 'customer@quickbite.local'
    enabled: true
    type: default
    description: Customer login email
  - key: customer_password
    value: 'Pass@123'
    enabled: true
    type: secret
    description: Customer login password
  - key: address_id
    value: ''
    enabled: true
    type: default
    description: UUID of a saved delivery address
  - key: menu_item_id
    value: ''
    enabled: true
    type: default
    description: UUID of a menu item to add to cart
  - key: cuisine_id
    value: ''
    enabled: true
    type: default
    description: UUID of a cuisine category
  - key: restaurant_id
    value: ''
    enabled: true
    type: default
    description: UUID of a restaurant
  - key: order_id
    value: ''
    enabled: true
    type: default
    description: UUID of a placed order
  - key: payment_id
    value: ''
    enabled: true
    type: default
    description: UUID of a payment record
  - key: review_id
    value: ''
    enabled: true
    type: default
    description: UUID of a submitted review
  - key: tip_amount
    value: '0'
    enabled: true
    type: default
    description: Tip amount in INR for order placement
  - key: total_order_amount
    value: '0'
    enabled: true
    type: default
    description: Expected total from checkout preview (used for price-lock validation)
  - key: notification_id
    value: ''
    enabled: true
    type: default
    description: UUID of a notification
