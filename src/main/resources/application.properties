# ------ Application -------------------------------------------
spring.application.name=QuickBite

# ------ Server ------------------------------------------------
server.port=8080

# ------ PostgreSQL ---------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5430/quickbite
spring.datasource.username=${DB_USERNAME:eshant}
spring.datasource.password=${DB_PASSWORD:mypg2510}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------ JPA / Hibernate ----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------ Flyway -------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------ Redis --------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6377}
spring.data.redis.username=${REDIS_USERNAME:quickbite}
spring.data.redis.password=${REDIS_PASSWORD:redistest}
app.cache.default-ttl=PT10M

# ------ Kafka --------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=quickbite-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.quickbite.quickbite.events,com.quickbite.quickbite.models
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.lang.Object
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
#quickbite.kafka.topics.order-events=quickbite.order.events
#quickbite.kafka.topics.notification-events=quickbite.notification.events
#quickbite.kafka.topics.delivery-events=quickbite.delivery.events
#quickbite.kafka.topics.order-events-dlq=quickbite.order.events.DLQ
#quickbite.kafka.topics.partitions=3
#quickbite.kafka.topics.dlq-partitions=1
#quickbite.kafka.topics.replication-factor=1

# ------ Security -----------------------------------------------
quickbite.jwt.private-key=${JWT_SECRET:classpath:certs/private.pem}
quickbite.jwt.public-key=${JWT_PUBLIC_KEY:classpath:certs/public.pem}
quickbite.jwt.access-token-expiry=PT15M
quickbite.jwt.refresh-token-expiry=P7D
quickbite.auth.max-concurrent-sessions=3
quickbite.auth.session-management-token-ttl=PT5M
quickbite.auth.refresh-token-cookie-name=qb_refresh_token
quickbite.auth.refresh-token-cookie-path=/api/v1/auth

# ------ Actuator -----------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ------ Multipart (menu item image uploads) --------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ------ Logging ------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.quickbite=DEBUG
