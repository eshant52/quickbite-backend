# ------ Application -------------------------------------------
spring.application.name=QuickBite

# ------ Server ------------------------------------------------
server.port=8080

# ------ PostgreSQL ---------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5430/quickbite
spring.datasource.username=${DB_USERNAME:eshant}
spring.datasource.password=${DB_PASSWORD:mypg2510}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------ JPA / Hibernate ----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------ Flyway -------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------ Redis --------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6377}
spring.data.redis.username=${REDIS_USERNAME:quickbite_user}
spring.data.redis.password=${REDIS_PASSWORD:quickbite_redis}

# ------ Kafka --------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=quickbite-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.quickbite.events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ------ Actuator -----------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ------ Multipart (menu item image uploads) --------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ------ Logging ------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.quickbite=DEBUG