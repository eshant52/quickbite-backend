# ------ Application -------------------------------------------
spring.application.name=QuickBite

# Local development is the default; production must explicitly set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# ------ Server ------------------------------------------------
server.port=8080

# ------ PostgreSQL ---------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5430/quickbite
spring.datasource.username=${DB_USERNAME:eshant}
spring.datasource.password=${DB_PASSWORD:mypg2510}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------ JPA / Hibernate ----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------ Flyway -------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------ Redis --------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6377}
spring.data.redis.username=${REDIS_USERNAME:quickbite}
spring.data.redis.password=${REDIS_PASSWORD:redistest}
app.cache.default-ttl=PT10M

# ------ Kafka --------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=quickbite-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.quickbite.quickbite.events,com.quickbite.quickbite.models
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.lang.Object
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ------ Security -----------------------------------------------
spring.security.oauth2.resourceserver.jwt.audiences[0]=quickbite
spring.security.oauth2.resourceserver.jwt.audiences[1]=challenge-audience

# 1. Global Session Rules
quickbite.auth.max-concurrent-sessions=3

# 2. Cookie Transport Layer
quickbite.auth.cookie.refresh-token-name=qb_refresh_token
quickbite.auth.cookie.refresh-token-path=/api/v1/auth

# 3. JWT Crypto & Token Specs
quickbite.auth.jwt.private-key=${JWT_SECRET:classpath:certs/private.pem}
quickbite.auth.jwt.public-key=${JWT_PUBLIC_KEY:classpath:certs/public.pem}
quickbite.auth.jwt.access-token-expiry=PT15M
quickbite.auth.jwt.access-token-audience=quickbite-api
quickbite.auth.jwt.refresh-token-expiry=P7D
quickbite.auth.jwt.challenge-token-expiry=PT5M
quickbite.auth.jwt.challenge-token-audience=quickbite-auth

# 4. Admin Allotment Settings
quickbite.admin.allotment.max-assignees=4


# ------ Actuator -----------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ------ Multipart (menu item image uploads) --------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ------ Logging ------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.quickbite=DEBUG

quickbite.auth.cors.allowed-origins=http://localhost:3000,http://localhost:8080,https://localhost:8080

# ------ S3 Storage (file uploads) ------------------------------
# AWS credentials are resolved via the default credential chain:
#   1. Environment variables: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   2. ~/.aws/credentials file
#   3. EC2 instance profile (in production)
quickbite.storage.s3.bucket-name=${AWS_S3_BUCKET:quickbite-uploads}
quickbite.storage.s3.region=${AWS_REGION:ap-south-1}
quickbite.storage.s3.presigned-url-expiry=PT10M

# ------ Dynamic Delivery Fee (shared across all profiles) ------
# These can be overridden per profile if pricing differs in prod.
quickbite.fee.base-fee=15.00
quickbite.fee.rate-per-km=8.00
quickbite.fee.min-fee=20.00
quickbite.fee.max-fee=80.00

# ------ Delivery Assignment (shared across all profiles) --------
quickbite.assignment.candidate-pool-size=10
quickbite.assignment.max-acceptable-drive-seconds=900

# ------ Routing (profile-specific — see application-dev.properties / application-prod.properties)
