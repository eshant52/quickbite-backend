# =============================================================================
# QuickBite — PROD profile
#
# Activate with:  SPRING_PROFILES_ACTIVE=prod
#
# Routing provider: Mapbox primary → Haversine fallback
#   In production, Mapbox provides accurate road-network data and Haversine
#   keeps order creation available if Mapbox is temporarily unreachable.
#
# All secrets MUST be injected via environment variables — never hardcoded.
# =============================================================================

# ------ Prod database (AWS RDS / managed PostgreSQL) -------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ------ Prod Redis (AWS ElastiCache) ------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ------ Prod Kafka (AWS MSK or managed Kafka) ---------------------------
spring.kafka.bootstrap-servers=${KAFKA_SERVERS}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=AWS_MSK_IAM
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;

# ------ CORS (prod frontend origin only) --------------------------------
quickbite.auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://quickbite.example.com}

# ------ Routing: Mapbox primary, Haversine fallback ---------------------
quickbite.routing.mapbox-enabled=true
quickbite.routing.mapbox-access-token=${MAPBOX_ACCESS_TOKEN}
quickbite.routing.osrm-enabled=false
quickbite.routing.timeout=3s

# ------ S3 (prod bucket) ------------------------------------------------
quickbite.storage.s3.bucket-name=${AWS_S3_BUCKET}
quickbite.storage.s3.region=${AWS_REGION:ap-south-1}
quickbite.storage.s3.presigned-url-expiry=PT10M

# ------ Logging: minimal in prod ----------------------------------------
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.quickbite=INFO

# ------ Actuator: restrict to health + info in prod ---------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ------ Fee: allow higher cap in prod if needed -------------------------
# quickbite.fee.max-fee=100.00   # Uncomment to override base config in prod
