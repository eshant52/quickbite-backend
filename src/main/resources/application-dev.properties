# =============================================================================
# QuickBite — DEV profile
#
# Activate with:  SPRING_PROFILES_ACTIVE=dev  (or spring.profiles.active=dev)
#
# Routing provider: OSRM (self-hosted, local)
# Mapbox:           disabled
# Logging:          verbose SQL + debug for all QuickBite classes
# =============================================================================

# ------ Dev database (local Docker) ------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5430/quickbite
spring.datasource.username=${DB_USERNAME:eshant}
spring.datasource.password=${DB_PASSWORD:mypg2510}

# ------ Dev Redis (local Docker) ----------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6377
spring.data.redis.username=${REDIS_USERNAME:quickbite}
spring.data.redis.password=${REDIS_PASSWORD:redistest}

# ------ Dev Kafka (local Docker) ----------------------------------------
spring.kafka.bootstrap-servers=localhost:9092

# ------ CORS (local frontend) -------------------------------------------
quickbite.auth.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# ------ Routing: OSRM only ---------------------------
# Run OSRM locally on macOS:
quickbite.routing.osrm-base-url=http://localhost:5000
quickbite.routing.osrm-enabled=true
quickbite.routing.mapbox-enabled=false
quickbite.routing.mapbox-access-token=
quickbite.routing.timeout=5s

# ------ S3: use localstack or a dev bucket in dev -----------------------
quickbite.storage.s3.bucket-name=${AWS_S3_BUCKET:quickbite-dev-uploads}
quickbite.storage.s3.region=${AWS_REGION:ap-south-1}

# ------ Logging: verbose in dev -----------------------------------------
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.quickbite=DEBUG

# ------ Actuator: expose all endpoints in dev ---------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
